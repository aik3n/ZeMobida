  <circle cx="330" cy="1200" r="120"/><circle cx="560" cy="1080" r="90"/>
  <circle cx="260" cy="800" r="110"/><circle cx="420" cy="560" r="95"/>
  <circle cx="520" cy="2350" r="90"/><circle cx="260" cy="2580" r="120"/>
</g>

<!-- labels baked into illustrative prototype -->
<g font-family="sans-serif" fill="#f5edd8" opacity=".78">
  <text x="1070" y="900" font-size="58">FARO</text>
  <text x="340" y="2200" font-size="58">CAMINO DEL PUERTO</text>
  <text x="920" y="2400" font-size="58">MUELLE</text>
